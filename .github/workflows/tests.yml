name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
  playwright:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build project
        run: |
          npm run build
      - name: Start Server
        run: |
          npm start &
      - name: Run Playwright tests
        run: |
          DEBUG=axe-watcher* npm test
        env:
          AXE_WATCHER_API_KEY: ${{ secrets.API_KEY }}
          DEVELOPERHUB_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          BUILD_ID: ${{ github.run_id }}
  devhub:
    permissions: write-all
    runs-on: ubuntu-22.04
    needs: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: dequelabs/axe-devhub-action@v1
        with:
          api_key: ${{ secrets.API_KEY }}
          project_id: ${{ secrets.PROJECT_ID }}